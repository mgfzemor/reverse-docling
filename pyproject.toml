[project]
name = "reverse-docling"
version = "0.1.0"
description = "Generate synthetic, labelled documents (PDF / page images) in many languages for document-classification training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "faker>=26.0",
    "babel>=2.15",
    "jinja2>=3.1",
    "playwright>=1.45",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "anyascii>=0.3.3",
]

[project.optional-dependencies]
augraphy = ["augraphy>=8.2"]

[project.scripts]
rdock = "reverse_docling.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_docling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
